<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Chat - AI Chatbot</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Nova Chat</h1>
          <p>Your friendly AI assistant</p>
        </div>
        <button id="clearChatBtn" class="ghost-btn" type="button">Clear Chat</button>
      </header>

      <section id="chatWindow" class="chat-window" aria-live="polite" aria-label="Chat messages"></section>

      <form id="chatForm" class="chat-form">
        <label for="messageInput" class="visually-hidden">Type your message</label>
        <textarea
          id="messageInput"
          placeholder="Message Nova..."
          rows="1"
          maxlength="1500"
          required
        ></textarea>
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </main>

    <template id="messageTemplate">
      <article class="message-row">
        <div class="bubble"></div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
