<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coin Dash Arcade</title>
  <style>
    :root {
      --bg: #0f1021;
      --panel: #1b1d3a;
      --accent: #ffcc00;
      --player: #4dd4ff;
      --enemy: #ff5f6d;
      --coin: #ffd166;
      --text: #f8f8ff;
    }

    * {
      box-sizing: border-box;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #2a2d58, var(--bg));
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .game-shell {
      width: min(920px, 95vw);
      background: var(--panel);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .score {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, #7f5af0, #5f6dff);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    canvas {
      width: 100%;
      height: 520px;
      border-radius: 16px;
      background: linear-gradient(180deg, #161834, #101223);
      display: block;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .message {
      margin-top: 12px;
      text-align: center;
      opacity: 0.8;
    }

    .legend {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 10px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <div class="score">Score: <span id="score">0</span></div>
      <div class="controls">
        <button id="startBtn">Start Game</button>
        <button id="restartBtn" disabled>Restart</button>
      </div>
    </header>

    <canvas id="gameCanvas" width="900" height="520" aria-label="Coin Dash Game"></canvas>

    <div class="message" id="message">Use arrow keys to move. Collect coins, dodge enemies!</div>

    <div class="legend">
      <span><i class="dot" style="background: var(--player);"></i> Player</span>
      <span><i class="dot" style="background: var(--coin);"></i> Coin</span>
      <span><i class="dot" style="background: var(--enemy);"></i> Enemy</span>
    </div>
  </main>

  <script>
    // ====== Canvas Setup ======
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const messageEl = document.getElementById("message");

    // ====== Simple Sound Effects (Web Audio API) ======
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep({ frequency = 440, duration = 0.12, type = "sine", volume = 0.15 }) {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gainNode.gain.value = volume;
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function playCoinSound() {
      playBeep({ frequency: 760, duration: 0.12, type: "triangle", volume: 0.18 });
    }

    function playGameOverSound() {
      playBeep({ frequency: 200, duration: 0.3, type: "sawtooth", volume: 0.2 });
    }

    // ====== Game State ======
    const gameState = {
      running: false,
      gameOver: false,
      score: 0,
      lastTime: 0,
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false,
    };

    // ====== Game Entities ======
    const player = {
      x: 100,
      y: 260,
      radius: 18,
      speed: 220, // pixels per second
      color: getComputedStyle(document.documentElement).getPropertyValue("--player"),
    };

    const coin = {
      x: 450,
      y: 260,
      radius: 12,
      color: getComputedStyle(document.documentElement).getPropertyValue("--coin"),
    };

    const enemies = [
      { x: 780, y: 100, radius: 16, speed: 120, direction: 1 },
      { x: 650, y: 400, radius: 20, speed: 160, direction: -1 },
      { x: 500, y: 260, radius: 14, speed: 140, direction: 1 },
    ];

    // ====== Utility Functions ======
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    function randomPosition(radius) {
      return {
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: radius + Math.random() * (canvas.height - radius * 2),
      };
    }

    function resetGame() {
      gameState.score = 0;
      gameState.gameOver = false;
      gameState.lastTime = 0;
      scoreEl.textContent = "0";
      player.x = 100;
      player.y = canvas.height / 2;

      const coinPos = randomPosition(coin.radius);
      coin.x = coinPos.x;
      coin.y = coinPos.y;

      enemies.forEach((enemy, index) => {
        enemy.x = canvas.width - 150 - index * 100;
        enemy.y = 100 + index * 140;
        enemy.direction = index % 2 === 0 ? 1 : -1;
      });

      messageEl.textContent = "Use arrow keys to move. Collect coins, dodge enemies!";
    }

    // ====== Input Handling ======
    window.addEventListener("keydown", (event) => {
      if (keys.hasOwnProperty(event.key)) {
        keys[event.key] = true;
      }
    });

    window.addEventListener("keyup", (event) => {
      if (keys.hasOwnProperty(event.key)) {
        keys[event.key] = false;
      }
    });

    // ====== Game Loop ======
    function update(deltaTime) {
      if (!gameState.running || gameState.gameOver) return;

      // Move player based on pressed keys.
      let velocityX = 0;
      let velocityY = 0;
      if (keys.ArrowUp) velocityY -= 1;
      if (keys.ArrowDown) velocityY += 1;
      if (keys.ArrowLeft) velocityX -= 1;
      if (keys.ArrowRight) velocityX += 1;

      // Normalize diagonal movement for consistent speed.
      if (velocityX !== 0 && velocityY !== 0) {
        const scale = Math.sqrt(0.5);
        velocityX *= scale;
        velocityY *= scale;
      }

      player.x += velocityX * player.speed * deltaTime;
      player.y += velocityY * player.speed * deltaTime;

      // Keep player inside the canvas.
      player.x = clamp(player.x, player.radius, canvas.width - player.radius);
      player.y = clamp(player.y, player.radius, canvas.height - player.radius);

      // Move enemies vertically up and down.
      enemies.forEach((enemy) => {
        enemy.y += enemy.speed * enemy.direction * deltaTime;
        if (enemy.y <= enemy.radius || enemy.y >= canvas.height - enemy.radius) {
          enemy.direction *= -1;
        }
      });

      // Check coin collection.
      if (distance(player, coin) < player.radius + coin.radius) {
        gameState.score += 10;
        scoreEl.textContent = gameState.score.toString();
        playCoinSound();

        const newPos = randomPosition(coin.radius);
        coin.x = newPos.x;
        coin.y = newPos.y;
      }

      // Check collisions with enemies.
      enemies.forEach((enemy) => {
        if (distance(player, enemy) < player.radius + enemy.radius) {
          gameState.gameOver = true;
          gameState.running = false;
          playGameOverSound();
          messageEl.textContent = "Game Over! Click Restart to try again.";
          restartBtn.disabled = false;
          startBtn.disabled = false;
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw coin
      ctx.beginPath();
      ctx.fillStyle = coin.color;
      ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw enemies
      enemies.forEach((enemy) => {
        ctx.beginPath();
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--enemy");
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw player
      ctx.beginPath();
      ctx.fillStyle = player.color;
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function gameLoop(timestamp) {
      if (!gameState.lastTime) {
        gameState.lastTime = timestamp;
      }
      const deltaTime = (timestamp - gameState.lastTime) / 1000;
      gameState.lastTime = timestamp;

      update(deltaTime);
      draw();

      if (gameState.running) {
        requestAnimationFrame(gameLoop);
      }
    }

    // ====== Button Events ======
    startBtn.addEventListener("click", () => {
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      resetGame();
      gameState.running = true;
      startBtn.disabled = true;
      restartBtn.disabled = false;
      requestAnimationFrame(gameLoop);
    });

    restartBtn.addEventListener("click", () => {
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      resetGame();
      gameState.running = true;
      gameState.gameOver = false;
      startBtn.disabled = true;
      restartBtn.disabled = false;
      requestAnimationFrame(gameLoop);
    });

    // Initial draw for clean UI.
    draw();
  </script>
</body>
</html>
